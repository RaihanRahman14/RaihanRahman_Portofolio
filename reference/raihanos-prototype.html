<style>
/* Layout: an OS desktop — top bar, wallpaper canvas with file icons, floating windows, taskbar. Phones get a home-screen grid and full-screen apps. Themes switch via body[data-term]. */
:root {
  color-scheme: dark;
  --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --bg: #0B1020; --win: #0E1428; --panel: #131B36; --border: #24305A;
  --fg: #D6DCE8; --dim: #8A96B0; --user: #F2B866; --path: #7CC7F2;
  --accent: #8FD6A6; --err: #F28B82; --sel: rgba(124,199,242,.25);
  --bar-h: 36px; --task-h: 48px;
}
body[data-term="matrix"]   { --bg:#030803; --win:#060E06; --panel:#0B170C; --border:#1B3A1F; --fg:#B8F5C2; --dim:#6FAA79; --user:#6EF28A; --path:#A8F0B5; --accent:#6EF28A; --err:#FF7B7B; --sel:rgba(110,242,138,.22) }
body[data-term="amber"]    { --bg:#100A02; --win:#160F04; --panel:#1E1507; --border:#43310F; --fg:#FFCF8A; --dim:#B9935A; --user:#FFB43D; --path:#FFDDA8; --accent:#FFC266; --err:#FF8A65; --sel:rgba(255,180,61,.22) }
body[data-term="sentinel"] { --bg:#081325; --win:#0C1A31; --panel:#11223F; --border:#22406B; --fg:#DCE8F7; --dim:#8DA2C0; --user:#4FB3FF; --path:#9CD3FF; --accent:#59D1C3; --err:#FF8F8F; --sel:rgba(79,179,255,.25) }
body[data-term="paper"]    { color-scheme: light; --bg:#DDE3EB; --win:#F7F9FB; --panel:#EAEEF3; --border:#BCC6D3; --fg:#1A2230; --dim:#556072; --user:#8A4F00; --path:#0B5FA5; --accent:#1C7344; --err:#B42318; --sel:rgba(11,95,165,.18) }

html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.55; }
::selection { background: var(--sel); }
button { font: inherit; color: inherit; }
a { color: var(--path); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--path) 45%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
#os { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { height: var(--bar-h); flex: none; display: flex; align-items: center; gap: 4px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box; }
.topbar .brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; }
.topbar .brand:hover, .topbar .brand[aria-expanded="true"] { background: var(--border); }
.topbar .brand b { color: var(--user); }
.topbar .spacer { flex: 1; }
.topbar .stat { color: var(--dim); display: flex; align-items: center; gap: 6px; padding: 0 8px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

.desk { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.icons { position: absolute; inset: 16px auto 16px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 92px); gap: 6px 10px; align-content: start; }
.icon { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; background: none; border: 1px solid transparent; border-radius: 10px; cursor: pointer; text-align: center; }
.icon:hover, .icon:focus-visible { background: color-mix(in srgb, var(--panel) 80%, transparent); border-color: var(--border); }
.icon .glyph { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--win); border: 1px solid var(--border); color: var(--path); }
.icon .glyph svg.i { width: 24px; height: 24px; }
.icon[data-app="terminal"] .glyph, .icon[data-app="portscan"] .glyph { color: var(--user); }
.icon[data-app="certs"] .glyph { color: var(--accent); }
.icon .lbl { font-size: 12px; line-height: 1.3; color: var(--fg); text-shadow: 0 1px 2px var(--bg); word-break: break-word; }

.taskbar { height: var(--task-h); flex: none; display: flex; align-items: center; gap: 6px; background: var(--panel); border-top: 1px solid var(--border); overflow-x: auto;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(10px, env(safe-area-inset-left, 0px)); box-sizing: content-box; }
.taskbar .hint { color: var(--dim); font-size: 12px; white-space: nowrap; padding: 0 6px; }
.task { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--win); cursor: pointer; white-space: nowrap; color: var(--dim); }
.task.active { color: var(--fg); border-color: var(--path); }
.task.min { opacity: .65; }

/* ---------- windows ---------- */
.win { position: absolute; display: flex; flex-direction: column; background: var(--win); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.25); min-width: 280px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); }
body[data-term="paper"] .win { box-shadow: 0 18px 40px rgba(20,30,50,.18), 0 2px 6px rgba(20,30,50,.08); }
.win.min { display: none; }
.win.max { inset: 0 !important; width: auto !important; height: auto !important; max-width: none; max-height: none; border-radius: 0; border-width: 0; }
.wbar { flex: none; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 6px 0 12px; background: var(--panel); border-bottom: 1px solid var(--border); cursor: grab; user-select: none; touch-action: none; }
.win.max .wbar, .win.dragging .wbar { cursor: default; }
.win:not(.focused) .wbar { color: var(--dim); }
.wbar .wt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.wbtns { display: flex; gap: 2px; }
.wbtns button { width: 34px; height: 30px; display: grid; place-items: center; background: none; border: 0; border-radius: 6px; cursor: pointer; color: var(--dim); }
.wbtns button:hover { background: var(--border); color: var(--fg); }
.wbtns button.close:hover { background: var(--err); color: var(--win); }
.wbtns .back { display: none; }
.wbody { flex: 1; min-height: 0; overflow: auto; }
.pad { padding: 20px 22px 28px; }

/* ---------- terminal app ---------- */
.term { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 18px 22px; overscroll-behavior: contain; font-size: 14.5px; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.55em; }
.banner { white-space: pre; overflow-wrap: normal; font-size: clamp(6px, 1.75vw, 13px); line-height: 1.08; color: var(--user); min-height: 0; }
.u { color: var(--user); } .p { color: var(--path); } .dim { color: var(--dim); }
.ok { color: var(--accent); } .err { color: var(--err); } .b { font-weight: 700; color: var(--fg); }
.h { color: var(--path); font-weight: 700; }
.ln button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
.prompt { display: flex; flex-wrap: wrap; align-items: baseline; }
.prompt label { white-space: pre; }
#cmd { flex: 1 1 8ch; min-width: 0; font: inherit; color: var(--fg); background: transparent; border: 0; outline: none; padding: 0; caret-color: var(--accent); }
.chips { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); background: var(--panel); overflow-x: auto; scrollbar-width: thin; }
.chips button { font-size: 12.5px; background: var(--win); border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; min-height: 38px; white-space: nowrap; cursor: pointer; flex: none; }
.chips button:hover { border-color: var(--path); color: var(--path); }
.chips .sep { flex: none; width: 1px; align-self: stretch; margin: 4px 2px; background: var(--border); }
.chips .lead { color: var(--dim); align-self: center; font-size: 12px; white-space: nowrap; }

/* ---------- GUI apps ---------- */
.app h2 { margin: 0 0 4px; font-size: 18px; color: var(--fg); text-wrap: balance; }
.app h3 { margin: 0; font-size: 15px; }
.app p { margin: 0 0 12px; max-width: 68ch; }
.app .meta { color: var(--dim); font-size: 12.5px; }
.lbl-sm { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); text-decoration: none; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--path); color: var(--path); }
.btn.primary { background: var(--user); border-color: var(--user); color: var(--win); font-weight: 700; }
.btn.primary:hover { color: var(--win); filter: brightness(1.08); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 6px; color: var(--fg); background: var(--panel); }

.about { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.about img { width: 132px; height: 132px; border-radius: 12px; border: 1px solid var(--border); object-fit: cover; flex: none; }
.about .txt { flex: 1 1 320px; min-width: 0; }

.explorer { display: flex; height: 100%; }
.explorer nav { flex: 0 0 200px; border-right: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
.explorer nav button { display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.explorer nav button[aria-current="true"] { background: var(--win); border-color: var(--border); color: var(--path); }
.explorer .pane { flex: 1; min-width: 0; overflow: auto; }
.pipeline { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 12.5px; line-height: 1.85; }
.pipeline span { color: var(--user); }

.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cert { position: relative; border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 12px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.cert .stamp { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .1em; padding: 3px 8px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 4px; transform: rotate(-3deg); text-decoration: none; }
.cert .stamp.idonly { border-color: var(--dim); color: var(--dim); transform: none; font-weight: 400; letter-spacing: 0; }
.cert.past .stamp { border-color: var(--dim); color: var(--dim); }

.log { font-size: 13px; }
.log .entry { display: grid; grid-template-columns: 150px 1fr; gap: 4px 16px; padding: 14px 0; border-bottom: 1px dashed var(--border); }
.log .ts { color: var(--dim); }
.log ul { margin: 6px 0 0; padding-left: 18px; }
.log .lvl { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--path); color: var(--path); margin-right: 8px; }

.feed a.item { display: flex; gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--fg); }
.feed a.item:hover .t { color: var(--path); }
.feed .n { color: var(--dim); font-variant-numeric: tabular-nums; }

.vcard { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
.vcard img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
.kv { display: grid; grid-template-columns: 100px 1fr; gap: 8px 14px; margin-top: 18px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.scan .bar { height: 6px; border-radius: 3px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; margin: 12px 0 16px; }
.scan .bar i { display: block; height: 100%; width: 0; background: var(--user); transition: width .12s linear; }
.scan table { border-collapse: collapse; width: 100%; font-size: 13px; }
.scan th { text-align: left; color: var(--dim); font-weight: 400; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); }
.scan td { padding: 7px 10px 7px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); white-space: nowrap; }
.scan td.open { color: var(--accent); }
.scan .tbl { overflow-x: auto; }
.skills { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }

/* ---------- menus & boot ---------- */
.menu { position: fixed; z-index: 9000; min-width: 220px; background: var(--win); border: 1px solid var(--border); border-radius: 10px; padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.4); }
.menu button, .menu .sub { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--panel); color: var(--path); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; }
.menu .sub { color: var(--dim); cursor: default; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-bottom: 2px; }
.menu .on::after { content: "●"; margin-left: auto; color: var(--accent); font-size: 10px; }

#boot { position: fixed; inset: 0; z-index: 10000; background: #05070D; color: #B9C2D3; padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); font-size: 13px; overflow: hidden; transition: opacity .35s; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .ok { color: #8FD6A6; } #boot .w { color: #F2B866; }
#boot .skip { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); color: #6B7590; font-size: 12px; }

/* ---------- tablet & phone ---------- */
@media (max-width: 640px) {
  :root { --task-h: 52px; }
  .icons { inset: 18px max(16px, env(safe-area-inset-right, 0px)) auto max(16px, env(safe-area-inset-left, 0px)); grid-auto-flow: row; grid-template-rows: none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; }
  .icon { width: auto; }
  .icon .glyph { width: 54px; height: 54px; border-radius: 16px; }
  .win { inset: 0 !important; width: auto !important; height: auto !important; max-width: none; max-height: none; border-radius: 0; border-width: 0; box-shadow: none; }
  .wbar { cursor: default; height: 44px; }
  .wbtns .min, .wbtns .max, .wbtns .close { display: none; }
  .wbtns .back { display: grid; width: auto; padding: 0 12px; gap: 6px; grid-auto-flow: column; color: var(--path); }
  .wbar { flex-direction: row-reverse; padding: 0 12px 0 4px; }
  .wbar .wi { display: none; }
  .explorer { flex-direction: column; }
  .explorer nav { flex: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  .log .entry { grid-template-columns: 1fr; }
  #cmd { font-size: 16px; }
  .chips .lead, .taskbar .hint { display: none; }
  .topbar .stat.on { display: none; }
}
@media (prefers-reduced-motion: reduce) { #boot, .scan .bar i { transition: none; } }
</style>

      <div id="out"></div>

<script>

      "╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝",
      "",
      "██████╗  █████╗ ██╗  ██╗███╗   ███╗ █████╗ ███╗   ██╗",
      "██╔══██╗██╔══██╗██║  ██║████╗ ████║██╔══██╗████╗  ██║",
      "██████╔╝███████║███████║██╔████╔██║███████║██╔██╗ ██║",
      "██╔══██╗██╔══██║██╔══██║██║╚██╔╝██║██╔══██║██║╚██╗██║",
      "██║  ██║██║  ██║██║  ██║██║ ╚═╝ ██║██║  ██║██║ ╚████║",
      "╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═══╝",
    ];
    const FILES = { "about.txt": "about", "experience.log": "experience", "projects/": "projects", "certs/": "certs",
      "archive/": "certs --all", "skills.md": "skills", "writing/": "writing", "contact.vcf": "contact", "cv.pdf": "cv" };

    const COMMANDS = {
      help: () => {
        const rows = [["about", "who I am and what I do", "about"], ["experience", "work and volunteering", "experience"], ["education", "university", "education"],
          ["projects", "things I've built", "projects"], ["open <name>", "open a project (try: open ioc-router)", "open ioc-router"],
          ["certs", "active certifications (certs --all for past)", "certs"], ["skills", "tools and frameworks", "skills"],
          ["writing", "articles on Medium", "writing"], ["contact", "email and socials", "contact"], ["cv", "download my CV (PDF)", "cv"],
          ["gui", "minimise the terminal, show the desktop", "gui"], ["start <app>", "open a desktop app (start portscan)", "start portscan"],
          ["theme <name>", "change colours (theme to list)", "theme"], ["lang id", "Bahasa Indonesia", "lang id"],
          ["whoami · ls · cat · history · clear", "the usual suspects", "whoami"]];
        return [ln(s("Available commands", "h")), gap(),
          ...rows.map(([c, d, r]) => ln(k(c, r), " ".repeat(Math.max(2, 18 - c.length)), s(d, "dim"))),
          gap(), ln(s("Tab autocompletes · ↑/↓ history · Ctrl+L clears · any key skips the animation", "dim")),
          ln(s("There may be a few undocumented commands. Happy hunting.", "dim"))];
      },
      about: () => [ln(s(C.name, "h"), s(" — " + C.role, "dim")), gap(), ...C.about.flatMap((p) => [ln(p), gap()]).slice(0, -1)],
      experience: () => C.experience.flatMap((e, i) => [
        ln(s(e.role, "b"), s(" @ " + e.org, "p")), ln(s(`${e.when} · ${e.where}`, "dim")),
        ...e.points.map((p) => ln("  - " + p)), ...(i < C.experience.length - 1 ? [gap()] : [])]),
      education: () => [ln(s(C.education.school, "b"), " — " + C.education.degree), ln(s(C.education.when + " · Jakarta", "dim"))],
      projects: () => [...C.projects.flatMap((p, i) => {
        const l = ln("    ");
        if (p.demo) l.segs.push(a("live demo ↗", p.demo), { t: "  " });
        l.segs.push(a("source ↗", p.repo), { t: "  " }, k(`open ${p.id}`));
        return [ln(s(`[${i + 1}] `, "dim"), s(p.name, "h"), s(`  (${p.tag})`, "dim")), ln("    " + p.desc), ln(s("    " + p.more, "dim")),
          ln(s("    stack: ", "dim"), p.stack.join(" · ").toLowerCase()), l, gap()];
      }), ln(s("More on GitHub: ", "dim"), a(L.github[0] + " ↗", L.github[1]))],
      open: (args) => {
        const qy = (args[0] || "").toLowerCase();
        if (qy === "github") return openUrl(L.github[1], "GitHub");
        const p = C.projects.find((x, i) => x.id === qy || x.alias.includes(qy) || String(i + 1) === qy);
        if (!p) return [ln(s(`open: no project named "${args[0] || ""}".`, "err"), " Try ", k("open ioc-router"), " or ", k("open hackngo"), ".")];
        return openUrl(args.includes("--source") || !p.demo ? p.repo : p.demo, p.name);
      },
      certs: (args) => {
        const all = args.includes("--all") || args.includes("-a");
        const lines = [ln(s(`Active certifications (${C.certs.length})`, "h")), gap(), ...C.certs.flatMap((c) => certLine(c))];
        if (all) lines.push(gap(), ln(s(`Past certifications (${C.pastCerts.length})`, "h")), gap(), ...C.pastCerts.flatMap((c) => certLine(c, true)));
        else lines.push(gap(), ln(s(`+ ${C.pastCerts.length} past certifications (incl. CEH). Run `, "dim"), k("certs --all")));
        return lines;
      },
      skills: () => C.skills.map(([g, xs]) => ln(s(pad(g, 14), "p"), xs.join(", "))),
      writing: () => [ln(s("Articles on Medium", "h")), gap(), ...C.articles.map(([t, u], i) => ln(s(`${String(i + 1).padStart(2, "0")}  `, "dim"), a(t, u))),
        gap(), ln(s("All articles: ", "dim"), a(L.medium[0] + " ↗", L.medium[1]))],
      contact: () => [ln(s(pad("email", 11), "p"), a(L.email, "mailto:" + L.email)),
        ...["linkedin", "github", "tryhackme", "medium", "instagram"].map((n) => ln(s(pad(n, 11), "p"), a(L[n][0], L[n][1]))),
        gap(), ln(s("Open to opportunities in security operations, consulting and GRC. Email is fastest.", "dim"))],
      cv: () => [ln("Downloading ", a("cv.pdf", "/cv.pdf"), s(" — generated from this site's content, no phone or ID numbers.", "dim")), ...previewNote("cv.pdf")],
      gui: () => { setTimeout(() => minWin("terminal"), reduceMotion ? 0 : 450); return [ln(s("→ ", "ok"), "Minimising terminal. Bring it back from the taskbar or the Terminal icon.")]; },
      start: (args) => {
        const id = (args[0] || "").toLowerCase().replace(/[/.].*$/, "");
        const map = { about: "about", experience: "experience", projects: "projects", certs: "certs", writing: "writing", portscan: "portscan", scanner: "portscan", contact: "contact", cv: "cv", archive: "archive" };
        if (!map[id]) return [ln("usage: start <app>   apps: ", ...Object.keys(ARGS_START).flatMap((x) => [k(x, "start " + x), { t: " " }]))];
        setTimeout(() => openApp(map[id]), 120);
        return [ln(s("→ ", "ok"), `Starting ${APPS[map[id]].label}`)];
      },
      lang: (args) => (args[0] || "").toLowerCase() === "id"
        ? [ln("Beralih ke Bahasa Indonesia: ", a("/id/", "/id/")), ...previewNote("the Indonesian version")]
        : [ln("usage: ", k("lang id"), s("   (English is the default)", "dim"))],
      theme: (args) => {
        const name = (args[0] || "").toLowerCase();
        if (!name) { const cur = document.body.dataset.term || "nightshift";
          return [ln(s("Themes", "h"), s(`  (current: ${cur})`, "dim")), gap(), ...Object.entries(THEMES).map(([n, d]) => ln(k(`theme ${n}`), " ".repeat(Math.max(2, 18 - n.length)), s(d, "dim")))]; }
        if (!THEMES[name]) return [ln(s(`theme: unknown theme "${args[0]}".`, "err"), " Run ", k("theme"), " to list them.")];
        setTheme(name); return [ln(s("✓ ", "ok"), `theme set to ${name}`)];
      },
      whoami: () => [ln("hacker"), ln(s("Logged in as a fellow hacker. The person you're looking for: ", "dim"), k("about"))],
      pwd: () => [ln("/home/hacker/raihan")],
      ls: () => [ln(...Object.keys(FILES).flatMap((f) => [k(f, FILES[f]), { t: "  " }]))],
      cat: (args) => {
        const f = args[0];
        if (!f) return [ln("usage: cat <file>   (run ", k("ls"), " to see files)")];
        if (f === "/etc/shadow" || f === "/etc/passwd") return [ln(s(`cat: ${f}: Permission denied`, "err")), ln(s("Nice try though.", "dim"))];
        const t = FILES[f] || FILES[f + "/"]; if (!t) return [ln(s(`cat: ${f}: No such file or directory`, "err"))];
        const [c, ...r] = t.split(" "); return COMMANDS[c](r);
      },
      cd: () => [ln(s("cd: this portfolio is a single directory. Try ", "dim"), k("ls"))],
      history: () => hist.length ? hist.map((x, i) => ln(s(String(i + 1).padStart(4) + "  ", "dim"), x)) : [ln(s("no history yet", "dim"))],
      clear: () => "CLEAR",
      sudo: () => [ln(s("hacker is not in the sudoers file. This incident will be reported.", "err")), ln(s("(to /dev/null — this is a static site, there's no server to report to)", "dim"))],
      nmap: () => [ln("Starting Nmap scan against raihan (127.0.0.1)"), ln("Host is up (0.0024s latency)."), gap(), ln(s("PORT       STATE  SERVICE", "b")),
        ...C.ports.map(([p, sv, n]) => ln(pad(p, 11), s(pad("open", 7), "ok"), `${sv} (${n})`)),
        gap(), ln(`Nmap done: 1 IP address (1 host up) scanned. ${C.ports.length} open ports.`), ln(s("Want the GUI version? ", "dim"), k("start portscan"))],
      rm: () => [ln(s("rm: cannot remove: Read-only file system", "err")), ln(s("It's a static site. There's nothing here to break.", "dim"))],
      exit: () => [ln("There's no escape. Try ", k("gui"), " for the desktop.")],
    };
    Object.assign(COMMANDS, { socials: COMMANDS.contact, email: COMMANDS.contact, certifications: COMMANDS.certs, resume: COMMANDS.cv, logout: COMMANDS.exit });
    const HIDDEN = new Set(["sudo", "nmap", "rm", "exit", "logout", "socials", "email", "certifications", "resume", "pwd", "cd"]);
    const ARGS_START = { about: 1, experience: 1, projects: 1, certs: 1, writing: 1, portscan: 1, contact: 1, cv: 1, archive: 1 };
    const ARGS = { open: ["ioc-router", "hackngo", "github"], theme: Object.keys(THEMES), certs: ["--all"], lang: ["id"], cat: Object.keys(FILES), start: Object.keys(ARGS_START) };

    function openUrl(url, label) {
      let w = null; try { w = window.open(url, "_blank", "noopener"); } catch (e) { /* blocked */ }
      return [ln(s("→ ", "ok"), `Opening ${label}: `, a(url.replace(/^https?:\/\//, "") + " ↗", url)), ...(w ? [] : [ln(s("  (if nothing opened, click the link above)", "dim"))])];
    }

    /* renderer */
    let busy = false, skip = false, current = Promise.resolve();
    const hist = []; let hIdx = 0;
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    const stick = () => { screen.scrollTop = screen.scrollHeight; };
    function makeNode(seg) {
      let n;
      if (seg.href) { n = document.createElement("a"); n.href = seg.href; if (/^https?:/.test(seg.href)) { n.target = "_blank"; n.rel = "noopener noreferrer"; } }
      else if (seg.run) { n = document.createElement("button"); n.type = "button"; n.dataset.run = seg.run; }
      else n = document.createElement("span");
      if (seg.c) n.className = seg.c;
      return n;
    }
    async function print(lines, speed, target = out) {
      for (const line of lines) {
        const div = document.createElement("div"); div.className = "ln" + (line.cls ? " " + line.cls : ""); target.appendChild(div);
        const parts = line.segs.map((seg) => { const n = makeNode(seg); div.appendChild(n); return [n, seg.t]; });
        if (reduceMotion || skip || !speed || document.hidden) { parts.forEach(([n, t]) => (n.textContent = t)); continue; }
        for (const [n, t] of parts) for (let i = 0; i < t.length;) {
          if (skip) { n.textContent = t; break; }
          i = Math.min(t.length, i + speed); n.textContent = t.slice(0, i); stick(); await frame();
        }
      }
      stick();
    }
    function echo(cmd) {
      out.append(h("div", { class: "ln" }, h("span", { class: "u" }, "hacker@raihanrahman"), ":", h("span", { class: "p" }, "~"), "$ ", cmd));
    }
    async function run(raw) {
      const line = raw.trim(); echo(line);
      if (!line) { stick(); return; }
      if (hist[hist.length - 1] !== line) hist.push(line);
      hIdx = hist.length;
      const [name, ...args] = line.split(/\s+/);
      const fn = COMMANDS[name.toLowerCase()];
      const res = fn ? fn(args) : [ln(s(`command not found: ${name}`, "err"), ". Type ", k("help"), " to see what's available.")];
      if (res === "CLEAR") { out.replaceChildren(); return; }
      res.push(gap());
      busy = true; skip = false;
      await print(res, 9);
      busy = false; skip = false;
      live.textContent = res.map((l) => l.segs.map((x) => x.t).join("")).join("\n");
    }
    const enqueue = (cmd) => { if (busy) skip = true; current = current.then(() => run(cmd)); return current; };

    form.addEventListener("submit", (e) => { e.preventDefault(); const v = input.value; input.value = ""; enqueue(v); });
    input.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (e.key === "ArrowUp") { if (hIdx > 0) input.value = hist[--hIdx]; e.preventDefault(); }
      else if (e.key === "ArrowDown") { if (hIdx < hist.length - 1) input.value = hist[++hIdx]; else { hIdx = hist.length; input.value = ""; } e.preventDefault(); }
      else if (e.key === "Tab" || (e.ctrlKey && key === "i")) { e.preventDefault(); complete(); }
      else if (e.ctrlKey && key === "l") { e.preventDefault(); out.replaceChildren(); }
      else if (e.ctrlKey && key === "c" && !getSelection().toString()) { e.preventDefault(); if (busy) skip = true; else { echo(input.value + "^C"); input.value = ""; stick(); } }
    });
    function complete() {
      const v = input.value.replace(/^\s+/, ""), parts = v.split(/\s+/);
      const prefix = parts[parts.length - 1].toLowerCase();
      let pool, head = "";
      if (parts.length <= 1) pool = Object.keys(COMMANDS).filter((n) => !HIDDEN.has(n));
      else { pool = ARGS[parts[0].toLowerCase()] || []; head = parts.slice(0, -1).join(" ") + " "; }
      const hits = pool.filter((x) => x.startsWith(prefix));
      if (hits.length === 1) input.value = head + hits[0] + (parts.length <= 1 && ARGS[hits[0]] ? " " : "");
      else if (hits.length > 1) {
        let common = hits[0]; hits.forEach((x) => { while (!x.startsWith(common)) common = common.slice(0, -1); });
        if (common.length > prefix.length) input.value = head + common;
        else { echo(input.value); print([ln(s(hits.join("  "), "dim"))], 0); }
      }
      stick();
    }

    el.addEventListener("keydown", (e) => { if (busy && !["Shift", "Control", "Alt", "Meta"].includes(e.key)) skip = true; });
    screen.addEventListener("pointerdown", () => { if (busy) skip = true; });
    const tabBtn = el.querySelector('[data-act="tab"]');
    tabBtn.addEventListener("pointerdown", (e) => e.preventDefault()); // keep the phone keyboard open
    tabBtn.addEventListener("click", () => { complete(); if (finePointer) input.focus({ preventScroll: true }); });
    el.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-run]");
      if (b) { enqueue(b.dataset.run); if (finePointer) input.focus({ preventScroll: true }); return; }
      if (finePointer && e.target.closest(".screen") && !e.target.closest("a") && getSelection().isCollapsed) input.focus({ preventScroll: true });
    });

    async function boot() {
      busy = true;
      await print(BANNER.map((b) => lc("banner", b)), 18, bootEl);
      await print([gap(), ln(s(C.name, "b"), " · " + C.role), gap(),
        ln(s("Welcome fellow hacker.", "b"), " Type ", k("help"), " or tap a command below to explore."),
        ln(s("Prefer windows and icons? Run ", "dim"), k("gui"), s(" to see the desktop.", "dim")), gap()], 7, bootEl);
      busy = false; skip = false;
    }
    return { el, focus: () => input.focus({ preventScroll: true }), start: () => { current = boot(); } };
  })();

  /* =====================================================================
     BOOT SEQUENCE (POST → login → desktop with terminal maximised)
     ===================================================================== */
  const bootScr = $("boot"), bootLog = $("bootlog");
  let bootSkip = false, booting = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, bootSkip ? 0 : ms));
  async function bootSequence() {
    booting = true; bootSkip = reduceMotion; bootScr.classList.remove("out"); bootLog.replaceChildren();
    const lines = [
      ["RaihanOS BIOS v2026.10 — POST", null], ["CPU: caffeine-powered analyst core @ 12h shifts", null], ["Memory test: 11 threat-intel providers ", "OK"],
      ["Checking certifications: 7 active, 5 archived ", "OK"], ["Mounting /home/raihan ", "OK"], ["Starting portfolio.service ", "OK"], ["", null],
      ["raihanrahman login: hacker", null], ["Password: ••••••••", null], ["Last login: from the internet", "w"],
    ];
    for (const [t, tag] of lines) {
      bootLog.append(h("div", null, t, tag === "OK" ? h("span", { class: "ok" }, "[ OK ]") : null));
      if (tag === "w") bootLog.lastChild.className = "w";
      await sleep(t ? 110 : 60);
    }
    await sleep(260);
    bootScr.classList.add("out"); booting = false;
    setTimeout(() => bootScr.setAttribute("hidden", ""), 360);
  }
  const skipBoot = () => { if (booting) bootSkip = true; };
  addEventListener("keydown", skipBoot); bootScr.addEventListener("pointerdown", skipBoot);

  async function restart() {
    wins.forEach((_, id) => closeWin(id));
    bootScr.removeAttribute("hidden");
    await bootSequence();
    launchTerminal();
  }
  function launchTerminal() {
    const w = openApp("terminal"); w.el.classList.add("max"); updateWall();
  }

  /* ---------- go ---------- */
  readWallColors(); sizeWall();
  let seen = false; try { seen = sessionStorage.getItem("raihanos-booted") === "1"; sessionStorage.setItem("raihanos-booted", "1"); } catch (e) { /* ignore */ }
  (seen ? Promise.resolve(bootScr.setAttribute("hidden", "")) : bootSequence()).then(() => { launchTerminal(); TERM.start(); });
})();
